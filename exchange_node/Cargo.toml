[package]
name = "sovereign_exchange_node"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Rust-native Sovereign Exchange peer node"

[dependencies]
exchange_core = { path = "../exchange_core" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
