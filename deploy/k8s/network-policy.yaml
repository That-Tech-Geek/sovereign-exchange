apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exchange-default-deny
  namespace: sovereign-exchange
spec:
  podSelector:
    matchLabels:
      app: exchange
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
