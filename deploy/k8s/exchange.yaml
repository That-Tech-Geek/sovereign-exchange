apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-exchange
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exchange-journal
  namespace: sovereign-exchange
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
  namespace: sovereign-exchange
spec:
  type: ClusterIP
  selector:
    app: exchange
  ports:
    - name: health
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exchange
  namespace: sovereign-exchange
spec:
  serviceName: exchange
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exchange
          image: ghcr.io/that-tech-geek/sovereign-exchange:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SE_JOURNAL_PATH
              value: /var/lib/sovereign-exchange/commands.journal
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: journal
              mountPath: /var/lib/sovereign-exchange
          readinessProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: exchange-journal
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: exchange
  namespace: sovereign-exchange
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: exchange
