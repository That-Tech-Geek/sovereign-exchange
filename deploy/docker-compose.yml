services:
  exchange:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SE_JOURNAL_PATH: /var/lib/sovereign-exchange/commands.journal
    ports:
      - "8080:8080"
    volumes:
      - exchange-journal:/var/lib/sovereign-exchange
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "sh", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 20s

volumes:
  exchange-journal:
