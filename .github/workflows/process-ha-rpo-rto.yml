name: Process HA RPO RTO Certification

on:
  pull_request:
    paths:
      - 'exchange_core/**'
      - '.github/workflows/process-ha-rpo-rto.yml'
  push:
    branches: [main]
    paths:
      - 'exchange_core/**'
      - '.github/workflows/process-ha-rpo-rto.yml'

jobs:
  process-ha-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run process restart HA certification
        working-directory: exchange_core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --test process_restart_ha_certification -- --nocapture 2>&1 | tee process-ha-certification.log
          grep -E '^[[:alpha:]_]+=' process-ha-certification.log > process-ha-certification-metrics.txt
          grep -q '^VERDICT=PASS$' process-ha-certification-metrics.txt
          cat process-ha-certification-metrics.txt
      - name: Upload process HA certification metrics
        uses: actions/upload-artifact@v4
        with:
          name: process-ha-rpo-rto-certification
          path: exchange_core/process-ha-certification-metrics.txt
