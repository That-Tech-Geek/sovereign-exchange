name: Core release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Certification
        run: cargo test --release --all-targets --all-features
      - name: Read core version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' exchange_core/Cargo.toml | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists; refusing to mutate it."
            exit 0
          fi
          gh release create "v${VERSION}"             --target "$GITHUB_SHA"             --title "sovereign-exchange core v${VERSION}"             --generate-notes
