name: Peer Chaos Stress

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exchange_node
      - name: Run adversarial loads
        run: |
          cargo run --release --manifest-path exchange_node/Cargo.toml --bin chaos_stress | tee chaos_stress.txt
      - name: Upload chaos report
        uses: actions/upload-artifact@v4
        with:
          name: peer-chaos-stress
          path: chaos_stress.txt
