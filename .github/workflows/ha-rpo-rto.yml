name: HA RPO RTO Certification

on:
  push:
    branches: [main, cert/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-certification:
    name: Measure consensus RPO/RTO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run HA benchmark and capture metrics
        working-directory: exchange_core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --test ha_failover_certification -- --nocapture 2>&1 | tee ha-certification.log
          grep -E '^[[:alpha:]_]+=' ha-certification.log > ha-certification-metrics.txt
          grep -q '^VERDICT=PASS$' ha-certification-metrics.txt
          cat ha-certification-metrics.txt
      - name: Upload HA certification metrics
        uses: actions/upload-artifact@v4
        with:
          name: ha-certification-metrics
          path: exchange_core/ha-certification-metrics.txt
