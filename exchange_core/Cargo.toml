[package]
name = "exchange_core"
version = "0.1.0"
edition = "2021"
authors = ["That-Tech-Geek"]
license = "Apache-2.0"
repository = "https://github.com/That-Tech-Geek/sovereign-exchange"
readme = "README.md"
description = "Ultra-Low-Latency Country-Shares Matching Engine"

[dependencies]
crossbeam-channel = "0.5"
core_affinity = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 1
